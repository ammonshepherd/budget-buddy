<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12372a" />
    <meta
      name="description"
      content="Budget Buddy is a simple envelope-style budgeting app."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Budget Buddy</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#budget" aria-label="Budget Buddy home">
        <img src="./icons/icon.svg" alt="" width="40" height="40" />
        <span>Budget Buddy</span>
      </a>

      <div class="header-actions">
        <span class="app-version" id="app-version" aria-label="Application version"></span>
        <button id="install-button" class="button button-secondary" type="button" hidden>
          Install app
        </button>
      </div>
    </header>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#budget" data-route="budget">Budget</a>
      <a href="#accounts" data-route="accounts">Accounts</a>
      <a href="#activity" data-route="activity">Activity</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>

    <main class="shell">
      <div id="app" aria-live="polite">
        <p class="loading-message">Loading Budget Buddy...</p>
      </div>
    </main>

    <footer class="site-footer">
      <p>Budget Buddy</p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
