name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  unit-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: budget_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: budget_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610080001_basic_budget.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610080002_account_deletion.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/database/rules.sql
      - run: node tests/database/generate.mjs > /tmp/golden.sql
      - run: psql -v ON_ERROR_STOP=1 -f /tmp/golden.sql
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Summarize browser results
        id: summary
        if: always()
        run: node scripts/browser-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ steps.summary.outputs.result }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
