# Checks and builds every pull request; on pushes to main it also deploys
# dist/ to Cloudflare (https://enoughmoney.app, configured in wrangler.jsonc).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; a newer push waits for the current one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public values from Settings → Secrets and variables → Actions → Variables.
          # Vite only exposes variables that start with VITE_ to app code.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Runs only after every check above passed, and only for main.
      # wrangler's version is pinned like the actions above.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4.148.0 deploy
        env:
          # A Cloudflare API token (secret) with the "Edit Cloudflare Workers"
          # permissions, and the account ID (variable). See README → Deployment.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
