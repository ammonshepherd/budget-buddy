<template id="dialog-template"><dialog class="editor-dialog"><div class="dialog-heading"><h2 tabindex="-1"></h2><button type="button" class="close-dialog secondary" aria-label="Close dialog">Close</button></div><div class="dialog-body"></div><p class="dialog-error notice" role="alert" hidden></p></dialog></template>
<template id="account-form-template"><form class="stack"><label>Account name<input name="name" required maxlength="100"></label><label>Type<select name="type"><option value="cash">Cash / checking / savings</option><option value="credit">Credit card</option><option value="tracking">Tracking (outside budget)</option></select></label><label class="checkbox"><input name="on_budget" type="checkbox" checked>Include in budget</label><label>Opening balance<input name="opening_balance" inputmode="decimal" required value="0.00"></label><label>Opening date<input name="opening_date" type="date" required></label><p class="hint">Enter card debt as a negative balance. The opening balance is at the start of this date; earlier transactions are not counted again. Baseline fields are locked after transactions exist.</p><label class="checkbox"><input name="archived" type="checkbox">Archive account</label><button type="submit">Save account</button></form></template>
<template id="category-form-template"><form class="stack"><label>Category name<input name="name" required maxlength="100"></label><label>Group<select name="group_id" required></select></label><label class="checkbox"><input name="archived" type="checkbox">Archive category</label><p class="hint">Archived categories keep their history and reserved money. Release unused assignments before archiving if you want that cash to be Assignable.</p><button type="submit">Save category</button></form></template>
<template id="group-form-template"><form class="stack"><label>Group name<input name="name" required maxlength="100"></label><label>Display order<input name="position" type="number" min="0" step="1" required value="0"></label><label class="checkbox"><input name="archived" type="checkbox">Archive group</label><p class="hint">Move or archive its categories before archiving a group.</p><button type="submit">Save group</button></form></template>
<template id="move-form-template"><form class="stack"><label>From<select name="from" required></select></label><label>To<select name="to" required></select></label><label>Amount<input name="amount" inputmode="decimal" required></label><p class="move-hint hint"></p><button type="submit">Move money</button></form></template>
<template id="transaction-form-template"><form class="stack transaction-form">
  <label>Account<select name="account_id" required></select></label><div class="form-grid"><label>Date<input name="date" type="date" required></label><label>Type<select name="kind"><option value="expense">Purchase</option><option value="income">Income</option><option value="refund">Categorized refund</option><option value="adjustment">Balance adjustment</option></select></label></div><label>Payee / description<input name="payee" required maxlength="500" autocomplete="off"></label><label>Amount<input name="amount" inputmode="decimal" required placeholder="0.00"></label><p class="hint">Enter positive amounts for purchases, income and refunds. A balance adjustment accepts a signed amount. Card credits without available payment reserves should use a balance adjustment.</p>
  <fieldset class="split-fieldset"><legend>Category splits</legend><div class="split-rows"></div><button class="add-split secondary" type="button">Add split</button><p class="split-summary hint"></p></fieldset><label>Note<textarea name="note" rows="2" maxlength="2000"></textarea></label><div class="form-grid"><label>Check number<input name="check_number" maxlength="100"></label><label>Tags (semicolon separated)<input name="tags" maxlength="500"></label></div><label>Bank posted date (optional)<input name="posted_date" type="date"></label><p class="transaction-status hint"></p><button class="fund-transaction secondary" type="button">Reallocate funds</button><button type="submit">Save transaction</button><button class="void-transaction danger secondary" type="button" hidden>Delete transaction</button>
</form></template>
<template id="split-row-template"><div class="split-row"><label>Category<select name="category_id" required></select></label><label>Split amount<input name="split_amount" inputmode="decimal" required></label><button type="button" class="remove-split secondary" aria-label="Remove split">×</button></div></template>
<template id="transfer-form-template"><form class="stack"><label>From account<select name="from" required></select></label><label>To account<select name="to" required></select></label><label>Date<input name="date" type="date" required></label><label>Amount<input name="amount" inputmode="decimal" required></label><p class="hint">Two linked entries move money without recording another purchase or income. Card payments require Available in the matching card payment category. Move prior-month Saved into Assigned first.</p><button type="submit">Save transfer</button></form></template>
<template id="transaction-template"><article class="transaction-card"><div class="transaction-top"><strong class="payee"></strong><strong class="amount"></strong></div><p class="meta"></p><p class="funding-status"></p><details class="transaction-details"><summary>Details</summary><ul class="allocations"></ul><p class="note"></p><p class="bank-data"></p></details><button class="edit-transaction text-button" type="button">Edit</button></article></template>
<template id="profile-form-template"><form class="stack"><label>Name<input name="name" maxlength="100" required autocomplete="name"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>New password (optional)<input name="password" type="password" autocomplete="new-password" minlength="12"></label><p class="hint">Email changes may require confirmation at both addresses. Use a unique password of at least 12 characters.</p><button type="submit">Save profile</button></form></template>
<template id="member-form-template"><form class="stack"><label>Existing user’s email<input name="email" type="email" required></label><p class="hint">The owner can add a user already created in Supabase Auth. This grants that user full access to this household’s financial data.</p><button type="submit">Add member</button></form></template>
<template id="confirm-form-template"><form class="stack"><p class="confirmation-text"></p><button type="submit" class="danger">Confirm</button></form></template>
<template id="reset-form-template"><form class="stack"><label>New password<input name="password" type="password" autocomplete="new-password" required minlength="12"></label><button type="submit">Update password</button></form></template>
<template id="import-form-template"><form class="stack"><label>Destination account<select name="account_id" required></select></label><label>CSV file<input name="file" type="file" accept=".csv,text/csv" required></label><p class="hint">Up to 2,000 rows / 5 MB. Choose the exact date format and amount direction in the next step.</p><button type="submit">Read CSV</button></form></template>
<template id="mapping-form-template"><form class="stack"><p class="mapping-account"></p><div class="mapping-fields form-grid"></div><label>Date format<select name="dateFormat"><option value="iso">YYYY-MM-DD</option><option value="mdy">MM/DD/YYYY</option><option value="dmy">DD/MM/YYYY</option></select></label><label>Signed amount direction<select name="reverse"><option value="no">Negative = money out</option><option value="yes">Positive = money out</option></select></label><button type="submit">Preview import</button></form></template>
<template id="mapping-field-template"><label><span></span><select><option value="">Not provided</option></select></label></template>
<template id="import-preview-template"><form class="stack"><p class="preview-summary"></p><div class="preview-rows"></div><p class="hint">Potential matches need your choice. Matching keeps the existing transaction and its categories, with a separate retained bank record for audit. Before-cutoff entries are history only.</p><button type="submit">Import selected rows</button></form></template>
<template id="preview-row-template"><div class="preview-row"><p></p><label>Action<select><option value="keep">Import as separate transaction</option><option value="skip">Skip</option></select></label></div></template>
