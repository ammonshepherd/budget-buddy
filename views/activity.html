<section class="page-view" aria-labelledby="activity-title">
  <header class="page-heading">
    <p class="eyebrow">Your spending trail</p>
    <h1 id="activity-title">Activity</h1>
    <p>Review transactions and keep your budget in sync with real life.</p>
  </header>

  <section class="list-card">
    <div class="section-heading">
      <h2>Recent activity</h2>
      <span class="section-count">0</span>
    </div>
    <p class="empty-state">Transactions will appear here when the activity model is connected.</p>
    <button class="primary-button" id="activity-action" type="button">Explore activity</button>
    <p class="page-status" data-page-status role="status"></p>
  </section>
</section>
