<section aria-labelledby="page-title">
  <div class="page-heading"><h1 id="page-title" tabindex="-1">Budget</h1><label>Month <input id="budget-month" type="month" required></label></div>
  <div class="balance-card"><span>Assignable</span><strong id="assignable"></strong><small id="budget-summary"></small></div>
  <p id="funding-warning" class="notice" hidden></p>
  <div class="toolbar"><button id="add-category" type="button">Add category</button><button id="add-group" class="secondary" type="button">Add group</button><button id="reallocate" class="secondary" type="button">Move money</button></div>
  <p class="hint">Remaining = Assigned − Spent. Saved stays separate until moved into Assigned.</p>
  <div id="budget-groups"></div>
  <p id="budget-empty" class="empty" hidden>Add a group and category to begin assigning money.</p>
</section>
<template id="budget-group-template"><section class="budget-group"><div class="group-heading"><h2></h2><button type="button" class="text-button">Edit group</button></div><div class="categories"></div></section></template>
<template id="budget-category-template">
  <article class="category-card">
    <div class="category-heading"><button type="button" class="category-name text-button"></button><span class="category-kind"></span></div>
    <form class="category-form"><label>Assigned<input name="assigned" inputmode="decimal" required></label><label>Planned<input name="planned" inputmode="decimal" required></label><button type="submit" class="secondary">Save</button></form>
    <dl class="category-totals"><div><dt>Spent</dt><dd class="spent"></dd></div><div><dt>Remaining</dt><dd class="remaining"></dd></div><div><dt>Saved</dt><dd class="saved"></dd></div></dl>
    <button class="use-saved text-button" type="button">Move Saved to Assigned</button>
  </article>
</template>
